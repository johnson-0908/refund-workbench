worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Do not log cookies, authorization headers, request bodies, or query strings.
    log_format app '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent';
    access_log /dev/stdout app;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 64k;
    client_body_timeout 15s;

    # The master and workers run as UID 101 with a read-only root filesystem.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Docker embedded DNS permits backend recreation without restarting the web.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Only successful fingerprinted assets get immutable caching. HTML, APIs,
    # health responses, and missing assets all use no-store, including SPA fallback.
    map "$uri:$status" $response_cache_control {
        default "no-store";
        "~^/assets/.+-[A-Za-z0-9_-]{8,}\\.(?:js|css|woff2?|png|jpe?g|svg|webp|ico):(?:200|304)$" "public, max-age=31536000, immutable";
    }

    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        autoindex off;

        # Keep add_header at one level so location cache policies cannot remove
        # inherited security headers. Ant Design Vue requires inline styles.
        add_header Cache-Control $response_cache_control always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /api {
            return 404;
        }

        location ^~ /api/ {
            # Constant authority only; no user-controlled upstream or Origin echo.
            set $backend_service http://backend:18080;
            proxy_pass $backend_service$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
            # A financial mutation must not be replayed automatically by a proxy.
            proxy_next_upstream off;
            proxy_intercept_errors off;
            proxy_cache off;
            proxy_buffering off;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Server;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
        }

        location ~ /\. {
            deny all;
        }

        location /assets/ {
            # Compress public static payloads only; authenticated HTML/API
            # responses remain uncompressed to avoid secret/body compression.
            gzip on;
            gzip_comp_level 5;
            gzip_min_length 1024;
            gzip_vary on;
            gzip_types text/css application/javascript image/svg+xml;
            try_files $uri =404;
        }

        location = /index.html {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
